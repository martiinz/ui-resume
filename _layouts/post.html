---
layout: default
---
<article class="wrap prose">
  <a class="back" href="{{ '/blog/' | relative_url }}">← Blog</a>
  <p class="date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time></p>
  <h1>{{ page.title }}</h1>
  {% if page.image and page.image != "" %}
    <img class="hero-img" src="{{ page.image | relative_url }}" alt="">
  {% endif %}

  {{ content }}
</article>
